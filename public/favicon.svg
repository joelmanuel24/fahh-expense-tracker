<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f11" />
      <stop offset="100%" stop-color="#1b1b22" />
    </linearGradient>

    <!-- Wallet Body Gradient -->
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863bff" />
      <stop offset="50%" stop-color="#584cf4" />
      <stop offset="100%" stop-color="#3b32b3" />
    </linearGradient>

    <!-- Wallet Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="50%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>
  </defs>

  <!-- PWA Premium Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#222" stroke-width="8" />

  <!-- Subtle grid pattern overlay for texture -->
  <g opacity="0.03">
    <path d="M 0,64 L 512,64 M 0,128 L 512,128 M 0,192 L 512,192 M 0,256 L 512,256 M 0,320 L 512,320 M 0,384 L 512,384 M 0,448 L 512,448" stroke="#ffffff" stroke-width="2" />
    <path d="M 64,0 L 64,512 M 128,0 L 128,512 M 192,0 L 192,512 M 256,0 L 256,512 M 320,0 L 320,512 M 384,0 L 384,512 M 448,0 L 448,512" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Group of Sparkles / Stars in the Background -->
  <!-- Sparkle 1 (Large Top Left) -->
  <path d="M 120 180 Q 120 120 60 120 Q 120 120 120 60 Q 120 120 180 120 Q 120 120 120 180 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  
  <!-- Sparkle 2 (Medium Top Right) -->
  <path d="M 380 140 Q 380 100 340 100 Q 380 100 380 60 Q 380 100 420 100 Q 380 100 380 140 Z" fill="url(#goldGrad)" opacity="0.85" filter="url(#glow)" />

  <!-- Sparkle 3 (Small Center Right) -->
  <path d="M 440 260 Q 440 230 410 230 Q 440 230 440 200 Q 440 230 470 230 Q 440 230 440 260 Z" fill="#863bff" filter="url(#glow)" opacity="0.9" />

  <!-- Sparkle 4 (Small Bottom Left) -->
  <path d="M 80 380 Q 80 350 50 350 Q 80 350 80 320 Q 80 350 110 350 Q 80 350 80 380 Z" fill="url(#goldGrad)" opacity="0.75" />

  <!-- Sparkle 5 (Medium Bottom Right) -->
  <path d="M 410 420 Q 410 380 370 380 Q 410 380 410 340 Q 410 380 450 380 Q 410 380 410 420 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- The Premium Wallet Vector -->
  <g transform="translate(106, 170)">
    <!-- Wallet Shadow -->
    <rect x="-8" y="12" width="316" height="200" rx="36" fill="#000000" opacity="0.4" filter="url(#glow)" />

    <!-- Wallet Back Panel -->
    <rect x="0" y="0" width="300" height="200" rx="32" fill="#2d2254" stroke="#584cf4" stroke-width="4" />

    <!-- Money/Cards sticking out from top of wallet -->
    <!-- Card 1 (Neon Purple Accent) -->
    <rect x="30" y="-30" width="100" height="60" rx="12" fill="#584cf4" stroke="#863bff" stroke-width="2" transform="rotate(-12, 80, 0)" />
    <!-- Card 2 (Neon Teal Accent) -->
    <rect x="140" y="-35" width="110" height="65" rx="12" fill="#10b981" stroke="#34d399" stroke-width="2" transform="rotate(8, 195, 0)" />

    <!-- Wallet Front Plate (Glassmorphic Gradient) -->
    <rect x="0" y="10" width="300" height="190" rx="32" fill="url(#walletGrad)" stroke="url(#foldGrad)" stroke-width="4" />

    <!-- Wallet Fold Stitching Detail -->
    <rect x="12" y="22" width="276" height="166" rx="20" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" opacity="0.3" />

    <!-- Gold Trim / Accent Line -->
    <path d="M 0 100 Q 150 120 300 100" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.75" />

    <!-- Wallet Closing Flap -->
    <g transform="translate(180, 50)">
      <!-- Flap body -->
      <path d="M 0 0 L 120 0 C 124 0, 128 4, 128 8 L 128 72 C 128 76, 124 80, 120 80 L 0 80 Z" fill="#1b1b22" stroke="#584cf4" stroke-width="4" />
      <path d="M 0 6 L 114 6 C 117 6, 120 9, 120 12 L 120 68 C 120 71, 117 74, 114 74 L 0 74 Z" fill="url(#foldGrad)" />
      
      <!-- Gold snap button / clasp -->
      <circle cx="90" cy="40" r="16" fill="url(#goldGrad)" filter="url(#glow)" />
      <circle cx="90" cy="40" r="8" fill="#121212" />
      <circle cx="90" cy="40" r="3" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>